name: TidalVolt Android CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tidalvolt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          # v3 defaults to the obsolete "tools" package, which Google no longer serves.
          packages: ""
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build TidalVolt and Companion debug APKs
        run: gradle :app:assembleDebug :companion:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TidalVolt-and-Companion-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            companion/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
